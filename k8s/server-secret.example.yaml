# Template only. Deliberately kept OUTSIDE k8s/manifests/ -- the shoppipe
# ArgoCD Application's source is the whole k8s/manifests directory (see
# `spec.source.path` on that Application), with no include/exclude filter,
# so anything committed there gets applied to the cluster as a real
# resource. An earlier version of this file lived in k8s/manifests/ and
# ArgoCD dutifully applied it, creating a real Secret whose jwt-secret was
# the literal string below -- a real, publicly-committed JWT signing key.
# Caught before it was ever wired into server.yaml's env; moved here as
# the actual fix, not just a stronger comment.
#
# Create the real Secret imperatively before deploying Phase 7, e.g.:
#
#   kubectl create secret generic shoppipe-secrets \
#     --namespace shoppipe \
#     --from-literal=jwt-secret="$(node -e 'console.log(require("crypto").randomBytes(48).toString("hex"))')"
#
# Same reasoning the project already applies elsewhere: a real signing
# secret has no business being committed to git, imperative-create-once is
# the standard way to hand a cluster a secret GitOps shouldn't own.
apiVersion: v1
kind: Secret
metadata:
  name: shoppipe-secrets
  namespace: shoppipe
type: Opaque
stringData:
  jwt-secret: REPLACE_ME
