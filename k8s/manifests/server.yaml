apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: shoppipe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      # This pod never talks to the Kubernetes API, so it doesn't need a
      # token for it mounted into the container.
      automountServiceAccountToken: false
      containers:
        - name: server
          # Pinned to the exact digest the pipeline scanned, signed, and
          # published — not a mutable :latest tag. This is provably the
          # same artifact that passed the Trivy gate and carries a
          # verified Cosign signature, not just "whatever :latest is now".
          # Bumped in Phase 6 to the build carrying prom-client
          # instrumentation (docker-publish.yml run on commit 22506f7),
          # re-verified with `cosign verify` before this bump.
          image: ghcr.io/rakesh00523/cicd-automation/server@sha256:944067f01725d2892a0f213d14328d5468b538ce22d818279aea97dd65710d04
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://mongo:27017/ecommerce
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: shoppipe
  # ServiceMonitor's selector matches the Service's own metadata.labels --
  # a completely different field from spec.selector below (which picks
  # which pods this Service routes to). Missing this label was why the
  # ServiceMonitor discovered this Service as an SD candidate but then
  # dropped it, right alongside client/mongo, instead of scraping it.
  labels:
    app: server
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 5000
      targetPort: 5000
