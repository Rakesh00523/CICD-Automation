apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: shoppipe
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: shoppipe
spec:
  replicas: 1
  strategy:
    type: Recreate # a single ReadWriteOnce volume can't be mounted by two pods at once
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      # This pod never talks to the Kubernetes API, so it doesn't need a
      # token for it mounted into the container.
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            # mongosh is a Node.js-based CLI with real startup overhead --
            # the default 1s probe timeout kills an otherwise-healthy mongod
            # before mongosh even finishes launching (verified: this was
            # causing a genuine crash loop, not a resource problem). A
            # readiness failure only pulls the pod out of the Service's
            # endpoints -- non-destructive -- so it's the safe place for
            # the more expensive, more thorough check.
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          # Liveness uses a cheap TCP check instead of exec'ing mongosh.
          # Under real system load (observed directly, several times) even
          # a generous exec timeout could itself time out -- creating a
          # spiral where an expensive probe gets starved, kills an
          # otherwise-healthy mongod, and the resulting restart adds more
          # load. A liveness probe should answer "is the process alive",
          # not "is it fully healthy" -- readiness above already covers that.
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: shoppipe
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
