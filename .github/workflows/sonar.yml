name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server deps
        working-directory: server
        # No --ignore-scripts: mongodb-memory-server's install script fetches
        # the MongoDB test binary the test suite depends on (verified locally
        # that skipping it makes every test fail with a connection timeout).
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Server tests with coverage
        working-directory: server
        run: npm run test:coverage

      - name: Client tests with coverage
        working-directory: client
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
