# SonarCloud project configuration.
# projectKey/organization match SonarCloud's default auto-generated values
# when importing this GitHub repo — confirm against the actual project
# after import and adjust if SonarCloud assigned different values.
sonar.projectKey=Rakesh00523_CICD-Automation
sonar.organization=rakesh00523

sonar.sources=client/src,server/src
sonar.tests=client/src,server/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
