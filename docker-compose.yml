services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ecommerce
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        # Baked into the built JS bundle at image build time (Vite env vars
        # are compile-time, not runtime) — must match wherever the browser
        # can actually reach the server, i.e. the published host port, not
        # the Docker-internal service name.
        VITE_API_BASE_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
